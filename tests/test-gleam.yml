name: Test Gleam setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          otp-version: "26.2"
          gleam-version: "1.4"
      - name: Assert gleam-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.gleam-version }}
        run: |
          echo "actual gleam-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: gleam-version output is empty"
            exit 1
          fi
          echo "PASS: gleam-version=$ACTUAL"
      - name: Assert otp-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.otp-version }}
        run: |
          echo "actual otp-version: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: otp-version output is empty"
            exit 1
          fi
          echo "PASS: otp-version=$ACTUAL"
      - name: Verify gleam is available
        run: |
          gleam --version
          echo "PASS: gleam is available"
