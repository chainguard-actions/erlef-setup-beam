name: Test Gleam installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu22
      RUNNER_ARCH: X64
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: setup
        uses: .
        with:
          otp-version: "false"
          gleam-version: "1.6.1"
          version-type: strict
        continue-on-error: true
      - name: Assert gleam-version output or graceful failure
        env:
          GLEAM_VERSION: ${{ steps.setup.outputs.gleam-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gleam-version: $GLEAM_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$GLEAM_VERSION" ]; then
              echo "FAIL: action succeeded but gleam-version output is empty"
              exit 1
            fi
            echo "PASS: gleam-version=$GLEAM_VERSION"
            which gleam || { echo "FAIL: gleam not found in PATH"; exit 1; }
            gleam --version
            echo "PASS: gleam is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment issue in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
