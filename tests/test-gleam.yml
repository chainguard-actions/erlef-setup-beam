name: Test Gleam installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
      RUNNER_ARCH: X64
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: setup
        uses: .
        with:
          otp-version: "27.0"
          gleam-version: "1.4"
          version-type: loose
        continue-on-error: true
      - name: Assert Gleam and OTP outputs or graceful failure
        env:
          OTP_VERSION: ${{ steps.setup.outputs.otp-version }}
          GLEAM_VERSION: ${{ steps.setup.outputs.gleam-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "otp-version: $OTP_VERSION"
          echo "gleam-version: $GLEAM_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OTP_VERSION" ]; then
              echo "FAIL: action succeeded but otp-version output is empty"
              exit 1
            fi
            echo "PASS: otp-version is '$OTP_VERSION'"
            if [ -z "$GLEAM_VERSION" ]; then
              echo "FAIL: action succeeded but gleam-version output is empty"
              exit 1
            fi
            echo "PASS: gleam-version is '$GLEAM_VERSION'"
            which gleam || { echo "FAIL: gleam not found on PATH"; exit 1; }
            gleam --version
            echo "PASS: gleam is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment constraint: node24 or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
