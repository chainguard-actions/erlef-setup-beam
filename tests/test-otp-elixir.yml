name: Test OTP and Elixir installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu22
      RUNNER_ARCH: X64
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: setup
        uses: .
        with:
          otp-version: "27.2"
          elixir-version: "1.17.3"
          install-hex: "true"
          install-rebar: "true"
          version-type: strict
        continue-on-error: true
      - name: Assert OTP and Elixir outputs or graceful failure
        env:
          OTP_VERSION: ${{ steps.setup.outputs.otp-version }}
          ELIXIR_VERSION: ${{ steps.setup.outputs.elixir-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "otp-version: $OTP_VERSION"
          echo "elixir-version: $ELIXIR_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OTP_VERSION" ]; then
              echo "FAIL: action succeeded but otp-version output is empty"
              exit 1
            fi
            echo "PASS: otp-version=$OTP_VERSION"
            if [ -z "$ELIXIR_VERSION" ]; then
              echo "FAIL: action succeeded but elixir-version output is empty"
              exit 1
            fi
            echo "PASS: elixir-version=$ELIXIR_VERSION"
            which elixir || { echo "FAIL: elixir not found in PATH"; exit 1; }
            elixir --version
            echo "PASS: elixir is available"
            which mix || { echo "FAIL: mix not found in PATH"; exit 1; }
            mix --version
            echo "PASS: mix is available"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment issue in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
