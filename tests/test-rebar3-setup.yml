name: Test rebar3 setup with OTP
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          otp-version: "26.x"
          rebar3-version: "3.x"
          version-type: loose
      - name: Assert rebar3 and OTP setup or graceful failure
        env:
          OTP_VERSION: ${{ steps.setup.outputs.otp-version }}
          REBAR3_VERSION: ${{ steps.setup.outputs.rebar3-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "otp-version: $OTP_VERSION"
          echo "rebar3-version: $REBAR3_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OTP_VERSION" ]; then
              echo "FAIL: action succeeded but otp-version output is empty"
              exit 1
            fi
            echo "PASS: otp-version is '$OTP_VERSION'"
            if [ -z "$REBAR3_VERSION" ]; then
              echo "FAIL: action succeeded but rebar3-version output is empty"
              exit 1
            fi
            echo "PASS: rebar3-version is '$REBAR3_VERSION'"
            echo "Checking rebar3 binary..."
            if ! command -v rebar3 >/dev/null 2>&1; then
              echo "FAIL: rebar3 not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: rebar3 found at $(command -v rebar3)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment issue in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
