name: Test basic OTP installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
      RUNNER_ARCH: X64
      RUNNER_TEMP: /tmp/runner-temp
      RUNNER_TOOL_CACHE: /tmp/runner-tool-cache
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up runner directories
        run: |
          mkdir -p /tmp/runner-temp
          mkdir -p /tmp/runner-tool-cache
      - id: setup
        uses: .
        with:
          otp-version: "27.0"
          version-type: loose
        continue-on-error: true
      - name: Assert OTP version output is set or action failed gracefully
        env:
          OTP_VERSION: ${{ steps.setup.outputs.otp-version }}
          OUTCOME: ${{ steps.setup.outcome }}
          SETUP_BEAM_VERSION: ${{ steps.setup.outputs.setup-beam-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "otp-version: $OTP_VERSION"
          echo "setup-beam-version: $SETUP_BEAM_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OTP_VERSION" ]; then
              echo "FAIL: action succeeded but otp-version output is empty"
              exit 1
            fi
            echo "PASS: otp-version is set to '$OTP_VERSION'"
            which erl || { echo "FAIL: erl not found on PATH"; exit 1; }
            erl -eval 'erlang:display(erlang:system_info(otp_release)), halt().' -noshell
            echo "PASS: erl is available"
            if [ -z "$SETUP_BEAM_VERSION" ]; then
              echo "FAIL: setup-beam-version output is empty"
              exit 1
            fi
            echo "PASS: setup-beam-version is set to '$SETUP_BEAM_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (environment constraint: node24 or network)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
