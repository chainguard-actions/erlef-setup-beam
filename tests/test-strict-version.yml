name: Test strict version type with exact OTP version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ImageOS: ubuntu24
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        continue-on-error: true
        with:
          otp-version: "26.2"
          version-type: strict
      - name: Assert strict OTP setup or graceful failure
        env:
          OTP_VERSION: ${{ steps.setup.outputs.otp-version }}
          BEAM_VERSION: ${{ steps.setup.outputs.setup-beam-version }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "otp-version: $OTP_VERSION"
          echo "setup-beam-version: $BEAM_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$OTP_VERSION" ]; then
              echo "FAIL: action succeeded but otp-version output is empty"
              exit 1
            fi
            echo "PASS: otp-version is '$OTP_VERSION'"
            if [ -z "$BEAM_VERSION" ]; then
              echo "FAIL: action succeeded but setup-beam-version output is empty"
              exit 1
            fi
            echo "PASS: setup-beam-version is '$BEAM_VERSION'"
            echo "Checking erl binary..."
            if ! command -v erl >/dev/null 2>&1; then
              echo "FAIL: erl not found on PATH after successful setup"
              exit 1
            fi
            echo "PASS: erl found at $(command -v erl)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/environment issue in act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
